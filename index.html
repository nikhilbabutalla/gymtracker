<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C0D0F">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Gym Tracker</title>
<style>
/* PLATE RACK. Black rubber, steel edges, one safety-yellow accent. Dark only: it reads in a dim gym and yellow needs a dark ground.
   Numerals and placards use a condensed face (system fonts only, offline). Signature: sets progress is drawn as a stack of plates. */
:root{
 --bg:#0C0D0F;--cd:#16181B;--cd2:#1E2125;--ln:#2C3036;--tx:#F4F5F6;--mu:#9BA2AA;
 --ac:#FFD60A;--on:#14120A;--ti:#2A2508;--ti2:#6B5C00;
 --ok:#5FD38D;--okbg:#12281C;--wn:#FF8A3D;--wnbg:#2E1A0E;--nbbg:#23262B;
 --num:"Bahnschrift","Roboto Condensed","sans-serif-condensed","Arial Narrow",system-ui,-apple-system,Roboto,sans-serif;
 --ease:cubic-bezier(.23,1,.32,1);
 color-scheme:dark;accent-color:var(--ac);caret-color:var(--ac);scrollbar-color:var(--ln) transparent}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
::selection{background:var(--ac);color:var(--on)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,Roboto,sans-serif;font-variant-numeric:tabular-nums}
/* condensed placard face for headings, numerals, labels */
h1,h2,.kpi .v,.read b,.lc .v,.set input,.q b,#tp b,.btn,.go,nav button,.seg button,.tag,.hd>b,.set span,.mr .n{font-family:var(--num);font-stretch:condensed}
header{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;background:var(--bg);border-bottom:1px solid var(--ln)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--ac) 0 56px,transparent 56px)}
header button{width:44px;height:44px;font-size:28px;background:none;border:0;color:var(--tx)}
h1{font-size:18px;margin:0;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
h2{font-size:24px;font-weight:800;text-transform:uppercase;margin:18px 2px 4px;letter-spacing:.01em;line-height:1.1;text-wrap:balance}
main{padding:0 12px 100px}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:12px;margin:10px 0;box-shadow:inset 0 1px 0 #ffffff0d}
.mut{color:var(--mu);font-size:13px}
.set{display:grid;grid-template-columns:20px 1fr 1fr 56px 44px;gap:8px;align-items:center;margin-top:8px}
.set span{color:var(--mu);font-size:15px;font-weight:700}
input{width:100%;height:48px;font:inherit;font-size:18px;text-align:center;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--tx)}
.set input{font-size:27px;font-weight:800;letter-spacing:.01em}
input::placeholder{color:#868E96;opacity:1;font-weight:600}
.set:has(.ck.on) input{background:var(--ti);border-color:var(--ti2)}
.ck{width:44px;height:44px;border-radius:50%;border:2px solid var(--ln);background:none;color:var(--mu);font-size:20px;padding:0}
.ck.on{background:var(--ac);border-color:var(--ac);color:var(--on);font-weight:800}
.row{display:flex;align-items:center;gap:10px;background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;margin:8px 0}
.row.on{background:var(--ti);box-shadow:inset 3px 0 0 var(--ac)}
.row>span{flex:1}
.q{display:flex;align-items:center;gap:6px;flex:none!important}
.q button{width:40px;height:40px;border-radius:6px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font-size:20px}
.q b{min-width:58px;text-align:center;font-size:19px;font-weight:800}
.btn{display:block;width:100%;height:48px;border:0;border-radius:6px;background:var(--ac);color:var(--on);font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-top:10px;text-align:center;line-height:48px}
.warn{background:var(--ti);border:1px solid var(--ac);border-radius:8px;padding:10px;margin:10px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;height:56px;border:0;background:none;color:var(--mu);font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
nav button.on{color:var(--ac);box-shadow:inset 0 3px 0 var(--ac)}
summary{min-height:32px;cursor:pointer}
.it{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--ln)}
.it:first-of-type{margin-top:8px}
.it input{width:24px;height:24px;flex:none}
.lf{height:48px;border:1px solid var(--ln);border-radius:6px;background:none;color:var(--mu);font:inherit;font-size:12px;padding:0 2px}
.lf.on{color:var(--tx);border-color:var(--ac)}
.sg{color:var(--ac);font-weight:600;font-size:13px;margin-top:4px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hd>b{font-size:18px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;line-height:1.1;min-width:0}
.hd>span:last-child:not(.mut){display:flex;gap:6px;flex:none}
summary b{font-family:var(--num);font-stretch:condensed;font-size:17px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
#bw{font-family:var(--num);font-stretch:condensed;font-size:28px;font-weight:800}
.go{height:36px;padding:0 12px;border-radius:6px;border:1px solid var(--ln);background:var(--cd2);color:var(--tx);font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.go[data-a="go"]{background:var(--ac);border-color:var(--ac);color:var(--on)}
.card.act{border:2px solid var(--ac);padding:11px}
#tp{position:fixed;left:8px;right:8px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:3;background:var(--ac);color:var(--on);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px #000c}
#tp[hidden]{display:none}
#tp>div{flex:1}
#tp b{font-size:36px;font-weight:800;line-height:1.05;letter-spacing:.01em}
#tp button{height:40px;padding:0 12px;border:0;border-radius:6px;background:var(--on);color:var(--tx);font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.tm main{padding-bottom:200px}
/* Session progress: one plate per set */
.segs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;height:14px;margin-top:10px}
.segs i{display:block;border-radius:2px;background:var(--ln)}
.segs i.on{background:var(--ac)}
/* Stats page */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--cd);border:1px solid var(--ln);padding:3px;border-radius:8px;margin-top:12px}
.seg button{height:44px;border:0;border-radius:6px;background:none;color:var(--mu);font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.seg.c2{grid-template-columns:repeat(2,1fr)}
.seg button[aria-checked="true"],.seg button[aria-selected="true"]{background:var(--ac);color:var(--on)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.kpi{background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:10px;box-shadow:inset 0 1px 0 #ffffff0d}
.kpi .l{font-size:12px;color:var(--mu)}
.kpi .v{font-size:30px;font-weight:800;letter-spacing:.005em;line-height:1.1;margin-top:2px;white-space:nowrap}
.kpi .v small{font-size:14px;font-weight:700;color:var(--mu);letter-spacing:0}
.kpi .d{font-size:12px;margin-top:4px;display:flex;align-items:center;gap:4px;color:var(--mu)}
.mini{height:6px;border-radius:1px;background:var(--ln);margin-top:10px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--ac);transform-origin:left}
.ic{width:14px;height:14px;flex:none}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px 0 6px;border-radius:4px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.wn{background:var(--wnbg);color:var(--wn)}
.tag.nb{background:var(--nbbg);color:var(--mu)}
.tag.pace{background:var(--ti);color:var(--ac)}
.mr{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--ln);padding:10px 0;min-height:48px;font:inherit;color:inherit}
.mr:first-child{border-top:0}
.mr .n{flex:1;font-size:17px;font-weight:700;min-width:0;text-transform:uppercase;letter-spacing:.03em}
.mr .f{color:var(--mu);font-size:13px}
.trk{position:relative;height:10px;border-radius:2px;background:var(--ln);margin-top:8px}
.trk i{display:block;height:100%;border-radius:2px;background:var(--ac);transform-origin:left}
.trk u{position:absolute;top:-3px;width:2px;height:16px;background:var(--tx);border-radius:1px;text-decoration:none;opacity:.85}
.more{margin-top:8px;font-size:13px;color:var(--mu);padding:8px 10px;background:var(--bg);border-radius:6px}
.an .trk i,.an .mini i{animation:grow .3s var(--ease)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin:0 2px}
.key span{display:inline-flex;align-items:center;gap:6px}
.key s{display:inline-block;width:14px;height:8px;border-radius:2px;background:var(--ac);text-decoration:none}
.key u{display:inline-block;width:2px;height:12px;background:var(--tx);opacity:.85;text-decoration:none}
.read{display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-height:40px}
.read b{font-size:28px;font-weight:800;letter-spacing:.005em}
.read span{color:var(--mu);font-size:13px}
svg.ch{display:block;width:100%;height:auto;touch-action:pan-y;user-select:none}
.sx{fill:var(--mu);font-size:11px}
.verdict{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:13px}
.empty{color:var(--mu);font-size:13px;padding:6px 0}
.lgd{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lc{text-align:left;background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:10px;min-height:92px;font:inherit;color:inherit;box-shadow:inset 0 1px 0 #ffffff0d}
.lc[aria-pressed="true"]{border:2px solid var(--ac);padding:9px}
.lc .n{font-size:13px;font-weight:600;line-height:1.2;min-height:32px}
.lc .v{font-size:26px;font-weight:800;letter-spacing:.005em}
.lc .v small{font-size:13px;color:var(--mu);font-weight:700}
.lc .d{font-size:12px;color:var(--mu);display:flex;align-items:center;gap:4px}
.lc svg.sp{display:block;width:100%;height:30px;margin-top:4px}
.st table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.st th,.st td{text-align:left;padding:6px 4px;border-top:1px solid var(--ln)}
.st th{color:var(--mu);font-weight:600;border-top:0}
.st td:last-child,.st th:last-child{text-align:right}
.st details summary{color:var(--ac);font-weight:600;font-size:13px}
.heat{display:grid;grid-template-columns:16px repeat(12,minmax(0,1fr));gap:3px;align-items:center}
.heat .rl{font-size:10px;color:var(--mu);text-align:center}
.cell{aspect-ratio:1;border-radius:2px;border:0;padding:0;background:var(--ln);min-width:0}
.cell.l1{background:color-mix(in srgb,var(--ac) 25%,var(--cd))}
.cell.l2{background:color-mix(in srgb,var(--ac) 50%,var(--cd))}
.cell.l3{background:color-mix(in srgb,var(--ac) 75%,var(--cd))}
.cell.l4{background:var(--ac)}
.cell.pre{background:none;border:1px dashed var(--ln)}
.cell.fut{background:none;border:1px solid var(--ln);opacity:.5}
.cell.sel{outline:2px solid var(--tx);outline-offset:1px}
.leg{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--mu);margin-top:8px}
.leg i{display:inline-block;width:12px;height:12px;border-radius:2px}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
/* Today, Plan, Settings */
header h1{flex:1;text-align:center}
#hg{color:var(--mu)}#hg.on{color:var(--ac)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 2px 0}
.wkl{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:12px 0 2px}
.wkb{height:64px;border-radius:8px;border:1px solid var(--ln);background:var(--cd);color:var(--mu);padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-family:var(--num);font-stretch:condensed;line-height:1.1}
.wkb span{font-size:12px;font-weight:700;letter-spacing:.06em}
.wkb b{font-size:22px;font-weight:800;color:var(--tx)}
.wkb i{font-style:normal;font-size:12px;height:14px;font-weight:800}
.wkb.part{border-color:var(--ac)}.wkb.part i{color:var(--ac)}
.wkb.fin{background:var(--ac);border-color:var(--ac);color:var(--on)}.wkb.fin b{color:var(--on)}
.wkb.rest{opacity:.55}
.wkb.today span{color:var(--ac)}
.wkb.sel{outline:2px solid var(--tx);outline-offset:1px}
.xr{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:10px 12px;margin:6px 0;min-height:56px;font:inherit;color:inherit;box-shadow:inset 0 1px 0 #ffffff0d}
.xr .xi{flex:none;min-width:30px;font-family:var(--num);font-stretch:condensed;font-size:15px;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.xr .xm{flex:1;min-width:0}
.xr .xm b{font-family:var(--num);font-stretch:condensed;font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;line-height:1.15}
.xr.cur{border-color:var(--ac)}
.xr.nxt{box-shadow:inset 3px 0 0 var(--ac)}.xr.nxt .xi{color:var(--ac)}
.card.big{border:2px solid var(--ac);padding:11px}
.big .hd>b{font-size:22px}
.pr{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--ln)}
.pr:first-child{border-top:0}
.pr .xm{flex:1;min-width:0}.pr .xm b{font-family:var(--num);font-stretch:condensed;font-size:16px;font-weight:800;text-transform:uppercase}
.tl{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.tw{height:48px;border-radius:6px;border:1px solid var(--ln);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--num);font-stretch:condensed;color:var(--mu);line-height:1.1}
.tw b{font-size:18px;font-weight:800;color:var(--tx)}.tw span{font-size:11px;font-weight:700}
.tw.past{background:var(--cd2)}
.tw.now{background:var(--ac);border-color:var(--ac);color:var(--on)}.tw.now b{color:var(--on)}
.tll{display:grid;grid-template-columns:1fr 1fr;margin-top:6px;font-size:11px;color:var(--mu);font-family:var(--num);font-stretch:condensed;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
/* Program setup */
.ta{display:block;width:100%;font:inherit;font-size:16px;line-height:1.4;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:10px;resize:vertical}
.ta::placeholder{color:#868E96}
select{width:100%;height:44px;font:inherit;font-size:16px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:0 8px}
.btn.alt{background:var(--cd2);color:var(--tx)}
.pd{margin-top:12px}.pd>b{font-family:var(--num);font-stretch:condensed;font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--ac)}
.pe{padding:8px 0;border-top:1px solid var(--ln);margin-top:6px}
.pl{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}.pl span:first-child{min-width:0;font-weight:600}
/* Feels native on a phone: instant press feedback, no tap delay, no text selection on buttons, no pull-to-refresh while scrolling */
html{overscroll-behavior-y:contain}
button,summary,[data-a],label.btn{touch-action:manipulation}
button{-webkit-user-select:none;user-select:none;transition:transform .12s var(--ease)}
button:active{transform:scale(.97)}
.mr:active,.seg button:active{transform:none}
.k2{grid-template-columns:repeat(2,minmax(0,1fr))!important}
@media (prefers-reduced-motion:reduce){.an .trk i,.an .mini i{animation:none}button{transition:none}button:active{transform:none}}
</style></head><body>
<header><button data-a="pv" id="hp" aria-label="Previous day">‹</button><h1 id="dt"></h1><button data-a="nx" id="hn" aria-label="Next day">›</button><button data-a="tab" data-t="b" id="hg" aria-label="Settings"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.4"/><circle cx="8" cy="17" r="2.4"/></svg></button></header>
<main id="v"></main>
<div id="tp" hidden></div>
<nav><button data-a="tab" data-t="w">Today</button><button data-a="tab" data-t="p">Plan</button><button data-a="tab" data-t="f">Food</button><button data-a="tab" data-t="s">Stats</button></nav>
<script>
const S1=[[
["Chest + triceps · heavy","Barbell bench press|3|6–8;Incline dumbbell press|3|8–10;Incline dumbbell fly|2|10–12;Cable crossover fly (low to high)|2|10–12;Overhead dumbbell extension|3|8–10;Lying dumbbell skull-crusher|2|10–12;Seated dip machine|2|8–10"],
["Back + biceps · heavy","Barbell bent-over row|3|6–8;Lat pulldown|3|8–12;Chest-supported dumbbell row|2|8–12;Straight-arm cable pulldown|2|10–12;Incline dumbbell curl|3|8–10;Hammer curl|2|8–10;One-arm dumbbell preacher curl|2|10–12"],

]];

const clean=(v,max)=>String(v==null?'':v).replace(/[<>"&`|;\u0000-\u001f\u007f]/g,'').replace(/\s+/g,' ').trim().slice(0,max);
// Single validation point for imports, typed routines and restored backups. Returns {program, W:[warnings], E:[errors]}
function normalizeProgram(raw,quiet){const W=[],E=[];
 if(!raw||typeof raw!=='object'||Array.isArray(raw))return{E:['This is not a program file.'],W};
 const wsIn=Array.isArray(raw.weeks)?raw.weeks:null;
 if(!wsIn||!wsIn.length)return{E:['No weeks were found in the file.'],W};
 if(wsIn.length>12)return{E:['The rotation has '+wsIn.length+' weeks. The maximum is 12.'],W};
 const weeks=[];let total=0,guessed=0;
 wsIn.forEach((w,wi)=>{const dIn=w&&Array.isArray(w.days)?w.days:[],days=[],seen={};
  if(dIn.length>7)W.push('Week '+(wi+1)+' lists more than 7 days. The extra days were skipped.');
  dIn.slice(0,7).forEach(d=>{if(!d||typeof d!=='object')return;
   const key=String(d.day==null?'':d.day).trim().slice(0,3).toLowerCase(),idx=DAYN.findIndex(x=>x.toLowerCase()===key);
   if(idx<0){W.push('Week '+(wi+1)+': skipped a day named “'+clean(d.day,12)+'”.');return}
   if(seen[idx]){W.push('Week '+(wi+1)+': '+DAYN[idx]+' appears twice. The second one was skipped.');return}
   const exIn=Array.isArray(d.exercises)?d.exercises:[],ex=[],names={};
   if(exIn.length>30)W.push('Week '+(wi+1)+' '+DAYN[idx]+': only the first 30 exercises were kept.');
   exIn.slice(0,30).forEach(e=>{if(!e||typeof e!=='object')return;let n=clean(e.name,60);if(!n){W.push('Week '+(wi+1)+' '+DAYN[idx]+': skipped an exercise with no name.');return}
    if(names[n.toLowerCase()]){let i=2;while(names[(n+' ('+i+')').toLowerCase()])i++;n=n+' ('+i+')'}names[n.toLowerCase()]=1;
    let sets=Math.round(Number(e.sets));if(!(sets>=1)){W.push(n+': sets missing, used 3.');sets=3}if(sets>10){W.push(n+': sets capped at 10.');sets=10}
    let reps=String(e.reps==null?'':e.reps).replace(/[‐-―-]/g,'–').replace(/\s+/g,'');
    if(!/^\d{1,3}(–\d{1,3})?$/.test(reps)){const m=reps.match(/\d{1,3}/g);reps=m?(m.length>1?m[0]+'–'+m[1]:m[0]):'';if(!reps){W.push(n+': reps missing, used 8–12.');reps='8–12'}else W.push(n+': reps read as '+reps+'.')}
    let m=MUSE.find(x=>x.toLowerCase()===String(e.muscle==null?'':e.muscle).trim().toLowerCase());
    if(!m){m=guessMuscle(n,String(idx));guessed++;if(!quiet)W.push(n+': muscle guessed as '+m+'.')}
    ex.push({name:n,sets,reps,muscle:m,note:clean(e.note,120)})});
   if(!ex.length){W.push('Week '+(wi+1)+' '+DAYN[idx]+' has no exercises, so it was skipped.');return}
   seen[idx]=1;days.push({day:DAYN[idx],title:clean(d.title,60)||'Training',exercises:ex});total+=ex.length});
  weeks.push({label:clean(w&&w.label,40),days})});
 if(!total)return{E:['No exercises were found in the file.'],W};
 if(quiet&&guessed)W.push('Muscles were guessed from the exercise names. Check them below.');
 const as=(Array.isArray(raw.assumptions)?raw.assumptions:[]).slice(0,8).map(a=>clean(a,200)).filter(Boolean);
 return{program:{name:clean(raw.name,40)||'My program',unit:raw.unit==='lb'?'lb':'kg',weeks,assumptions:as},W,E}}

 const a=txt.indexOf('{'),b=txt.lastIndexOf('}');if(a>=0&&b>a)txt=txt.slice(a,b+1);

function parseRoutineText(txt){const W=[],weeks=[];let wk=null,day=null;

 const exA=/^(.+?)[\s:,\-–—]*\b(\d{1,2})\s*(?:[x×]|sets?\s*(?:of|x|×)?)\s*(\d{1,3}(?:\s*(?:-|–|—|to)\s*\d{1,3})?)(?!\d)/i;

  m=exA.exec(s);if(m)return{name:m[1].replace(/[\s:,\-–—]+$/,''),sets:m[2],reps:m[3].replace(/\s*to\s*/i,'–'),muscle:''};return null};
 String(txt||'').slice(0,60000).split(/\r?\n/).forEach(line=>{let t=line.trim();if(!t)return;
  if(/^(week|wk)\b/i.test(t)){newWeek(t);return}

   if(rem){const e=readEx(rem);if(e){day.title='Training';day.exercises.push(e)}else day.title=rem}return}

  let g='';for(let t=mn;t<=mx;t+=stp)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--ln)"/><text class="sx" x="${L-6}" y="${Y(t)+4}" text-anchor="end">${t}</text>`;
  let pr=0;e.forEach((v,i)=>{if(v>=e[pr])pr=i});
  if(n>1)g+=`<polyline points="${ss.map((s,i)=>X(i)+','+Y(s.e)).join(' ')}" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  g+=ss.map((s,i)=>`<circle cx="${X(i)}" cy="${Y(s.e)}" r="${i==pr?5.5:3.5}" fill="${i==pr?'var(--cd)':'var(--ac)'}" stroke="var(--ac)" stroke-width="${i==pr?2.5:0}"/>`).join('');
  g+=`<text class="sx" x="${X(pr)}" y="${Y(e[pr])-10}" text-anchor="${pr>n*.8&&n>2?'end':'middle'}" style="fill:var(--tx);font-weight:600">Best ${Math.round(e[pr])}</text>`;
  g+=`<text class="sx" x="${X(0)}" y="${H-6}" text-anchor="${n>1?'start':'middle'}">${fds(ss[0].d)}</text>`+(n>1?`<text class="sx" x="${X(n-1)}" y="${H-6}" text-anchor="end">${fds(ss[n-1].d)}</text>`:'');
  h+=`<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Estimated one-rep max per session for ${l.n}">${g}</svg>${n<2?'<div class="empty">Log one more session to draw a line.</div>':''}
   <table><tr><th>Date</th><th>Best set</th><th>Est. 1RM</th></tr>${ss.slice(-5).reverse().map(s=>`<tr><td>${fd(s.d)}</td><td>${s.kg} × ${s.rp}</td><td>${Math.round(s.e)} ${U()}</td></tr>`).join('')}</table>
   <div class="mut" style="margin-top:8px">Epley formula. Less reliable above about 10 reps.</div>`}
 h+='</div>';
 const ps=prs();
 h+=`<details class="card"><summary><b>All exercises (${ps.length})</b></summary>${ps.length?`<table><tr><th>Exercise</th><th>Best set</th><th>Sessions</th></tr>${ps.map(o=>`<tr><td>${o.n}${o.cnt>1&&o.bd==o.ld?' 🏆':''}</td><td>${o.best.kg} × ${o.best.rp}</td><td>${o.cnt}</td></tr>`).join('')}</table>`:'<div class="empty">Log some sets and your lifts will appear here.</div>'}</details>`;
 return h}

 const an=stAn;stAn=false;
 const seg=[['w','This week'],['b','Body'],['l','Lifts']].map(([k,l])=>`<button role="tab" aria-selected="${sst==k}" data-a="sst" data-s="${k}">${l}</button>`).join('');
 return`<div class="st${an?' an':''}"><div class="seg" role="tablist" aria-label="Stats sections">${seg}</div><div role="tabpanel">${sst=='w'?sWeek():sst=='b'?sBody():sLifts()}</div></div>`}
// ---- Reps-left label, notes, weight suggestions ----
const lfT=v=>v===''||v==null?'left?':v>=3?'3+ left':v+' left';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const noteH=n=>D.notes&&D.notes[n]?`<div class="mut">📝 ${esc(D.notes[n])}</div>`:'';
// Double progression: add weight once every set hits the top of the rep range; 3+ reps left means the weight was too light.
function sugg(pv,r){
 if(!pv||!pv.length)return'';
 const hi=parseInt(String(r).split('–').pop()),lo=parseInt(String(r).split('–')[0]);
 const wts=pv.map(a=>parseFloat(a[0])).filter(x=>x>0);
 if(!wts.length||!hi)return'';
 const w=Math.max(...wts),at=pv.filter(a=>parseFloat(a[0])==w),mn=Math.min(...at.map(a=>parseFloat(a[1])||0)),lr=pv[pv.length-1][2],rir=lr===''||lr==null?null:+lr;
 let t;
 const I=I5(),u=U();
 if(mn>=hi)t=rir!=null&&rir>=3?`Try ${w+2*I} ${u} (+${2*I}): it felt easy, ${rir}+ reps left`:`Try ${w+I} ${u} (+${I}): you hit ${hi} reps on every set`;
 else if(mn<lo)t=`Try ${w-I} ${u} (−${I}): reps fell below ${lo}`;
 else if(rir!=null&&rir>=3)t=`Try ${w+I} ${u} (+${I}): ${rir}+ reps were left`;
 else t=`Stay at ${w} ${u}: beat ${mn} reps on every set`;
 return`<div class="sg">${t}</div>`}
if(D.program){const r=normalizeProgram(D.program);if(r.program)D.program=r.program;else delete D.program}
if(D.foods)D.foods=cleanFoods(D.foods);
render();
