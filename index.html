<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2D4BD8">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Gym Tracker</title>
<style>
:root{--bg:#ECEEF1;--cd:#fff;--tx:#15181D;--mu:#6B7380;--ln:#D9DDE3;--ac:#2D4BD8;--ti:#DDE5FF;--ok:#17744A;--okbg:#DFF2E8;--wn:#9A5B00;--wnbg:#FBEBCF;--nbbg:#E6E9EE}
@media(prefers-color-scheme:dark){:root{--bg:#101216;--cd:#1A1D23;--tx:#ECEEF1;--mu:#98A0AD;--ln:#2A2F38;--ac:#8FA6FF;--ti:#1E2748;--ok:#6FD0A0;--okbg:#14301F;--wn:#F0B35A;--wnbg:#3A2A10;--nbbg:#262B33}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,Roboto,sans-serif;font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;background:var(--bg);border-bottom:1px solid var(--ln)}
header button{width:44px;height:44px;font-size:28px;background:none;border:0;color:var(--tx)}
h1{font-size:17px;margin:0}
h2{font-size:22px;margin:14px 2px 2px;letter-spacing:-.01em}
main{padding:0 12px 100px}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:10px;padding:12px;margin:10px 0}
.mut{color:var(--mu);font-size:13px}
.set{display:grid;grid-template-columns:20px 1fr 1fr 56px 44px;gap:8px;align-items:center;margin-top:8px}
.set span{color:var(--mu);font-size:13px}
input{width:100%;height:44px;font:inherit;font-size:18px;text-align:center;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx)}
.ck{width:44px;height:44px;border-radius:50%;border:2px solid var(--ln);background:none;color:var(--mu);font-size:20px;padding:0}
.ck.on{background:var(--ac);border-color:var(--ac);color:var(--bg)}
.row{display:flex;align-items:center;gap:10px;background:var(--cd);border:1px solid var(--ln);border-radius:10px;padding:8px 10px;margin:8px 0}
.row.on{background:var(--ti)}
.row>span{flex:1}
.q{display:flex;align-items:center;gap:6px;flex:none!important}
.q button{width:40px;height:40px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font-size:20px}
.q b{min-width:58px;text-align:center}
.btn{display:block;width:100%;height:48px;border:0;border-radius:10px;background:var(--ac);color:var(--bg);font:inherit;font-weight:600;margin-top:10px;text-align:center;line-height:48px}
.warn{background:var(--ti);border:1px solid var(--ac);border-radius:10px;padding:10px;margin:10px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;height:56px;border:0;background:none;color:var(--mu);font:inherit;font-weight:600}
nav button.on{color:var(--ac);box-shadow:inset 0 3px 0 var(--ac)}
summary{min-height:32px;cursor:pointer}
.it{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--ln)}
.it:first-of-type{margin-top:8px}
.it input{width:24px;height:24px;flex:none;accent-color:var(--ac)}
.lf{height:44px;border:1px solid var(--ln);border-radius:8px;background:none;color:var(--mu);font:inherit;font-size:12px;padding:0 2px}
.lf.on{color:var(--tx);border-color:var(--ac)}
.sg{color:var(--ac);font-weight:600;font-size:13px;margin-top:4px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.go{height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--ac);background:none;color:var(--ac);font:inherit;font-weight:600}
.card.act{border:2px solid var(--ac)}
#tp{position:fixed;left:8px;right:8px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:3;background:var(--ac);color:var(--bg);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 2px 12px #0006}
#tp[hidden]{display:none}
#tp>div{flex:1}
#tp button{height:40px;padding:0 12px;border:0;border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;font-weight:600}
.tm main{padding-bottom:200px}
/* Stats page */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--ln);padding:3px;border-radius:10px;margin-top:12px}
.seg button{height:44px;border:0;border-radius:8px;background:none;color:var(--mu);font:inherit;font-weight:600}
.seg button[aria-selected="true"]{background:var(--cd);color:var(--tx);box-shadow:0 1px 2px #0003}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.kpi{background:var(--cd);border:1px solid var(--ln);border-radius:10px;padding:10px}
.kpi .l{font-size:12px;color:var(--mu)}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:2px;white-space:nowrap}
.kpi .v small{font-size:13px;font-weight:600;color:var(--mu);letter-spacing:0}
.kpi .d{font-size:12px;margin-top:4px;display:flex;align-items:center;gap:4px;color:var(--mu)}
.mini{height:6px;border-radius:3px;background:var(--ln);margin-top:10px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--ac);border-radius:3px;transform-origin:left}
.ic{width:14px;height:14px;flex:none}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px 0 6px;border-radius:11px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.wn{background:var(--wnbg);color:var(--wn)}
.tag.nb{background:var(--nbbg);color:var(--mu)}
.tag.pace{background:var(--ti);color:var(--ac)}
.mr{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--ln);padding:10px 0;min-height:48px;font:inherit;color:inherit}
.mr:first-child{border-top:0}
.mr .n{flex:1;font-weight:600;min-width:0}
.mr .f{color:var(--mu);font-size:13px}
.trk{position:relative;height:8px;border-radius:4px;background:var(--ln);margin-top:8px}
.trk i{display:block;height:100%;border-radius:4px;background:var(--ac);transform-origin:left}
.trk u{position:absolute;top:-3px;width:2px;height:14px;background:var(--tx);border-radius:1px;text-decoration:none;opacity:.75}
.more{margin-top:8px;font-size:13px;color:var(--mu);padding:8px 10px;background:var(--bg);border-radius:8px}
.an .trk i,.an .mini i{animation:grow .3s cubic-bezier(.23,1,.32,1)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin:0 2px}
.key span{display:inline-flex;align-items:center;gap:6px}
.key s{display:inline-block;width:14px;height:6px;border-radius:3px;background:var(--ac);text-decoration:none}
.key u{display:inline-block;width:2px;height:12px;background:var(--tx);opacity:.75;text-decoration:none}
.read{display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-height:40px}
.read b{font-size:22px;letter-spacing:-.02em}
.read span{color:var(--mu);font-size:13px}
svg.ch{display:block;width:100%;height:auto;touch-action:pan-y;user-select:none}
.sx{fill:var(--mu);font-size:11px}
.verdict{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:13px}
.empty{color:var(--mu);font-size:13px;padding:6px 0}
.lgd{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lc{text-align:left;background:var(--cd);border:1px solid var(--ln);border-radius:10px;padding:10px;min-height:92px;font:inherit;color:inherit}
.lc[aria-pressed="true"]{border:2px solid var(--ac);padding:9px}
.lc .n{font-size:13px;font-weight:600;line-height:1.2;min-height:32px}
.lc .v{font-size:20px;font-weight:700;letter-spacing:-.02em}
.lc .v small{font-size:12px;color:var(--mu);font-weight:600}
.lc .d{font-size:12px;color:var(--mu);display:flex;align-items:center;gap:4px}
.lc svg.sp{display:block;width:100%;height:30px;margin-top:4px}
.st table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.st th,.st td{text-align:left;padding:6px 4px;border-top:1px solid var(--ln)}
.st th{color:var(--mu);font-weight:600;border-top:0}
.st td:last-child,.st th:last-child{text-align:right}
.st details summary{color:var(--ac);font-weight:600;font-size:13px}
.heat{display:grid;grid-template-columns:16px repeat(12,minmax(0,1fr));gap:3px;align-items:center}
.heat .rl{font-size:10px;color:var(--mu);text-align:center}
.cell{aspect-ratio:1;border-radius:4px;border:0;padding:0;background:var(--ln);min-width:0}
.cell.l1{background:color-mix(in srgb,var(--ac) 25%,var(--cd))}
.cell.l2{background:color-mix(in srgb,var(--ac) 50%,var(--cd))}
.cell.l3{background:color-mix(in srgb,var(--ac) 75%,var(--cd))}
.cell.l4{background:var(--ac)}
.cell.pre{background:none;border:1px dashed var(--ln)}
.cell.fut{background:none;border:1px solid var(--ln);opacity:.5}
.cell.sel{outline:2px solid var(--tx);outline-offset:1px}
.leg{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--mu);margin-top:8px}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px}
@media (prefers-reduced-motion:reduce){.an .trk i,.an .mini i{animation:none}}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
</style></head><body>

 mus.sort((a,b)=>ord[a.s]-ord[b.s]||(b.e-b.d)-(a.e-a.d));
 const plan=Object.values(TG).reduce((s,v)=>s+v,0),tot=mus.reduce((s,m)=>s+m.d,0);
 let sess=0;for(let i=0;i<7;i++)if(dSets(addD(m0,i))>0)sess++;
 const wp=wpts(),v=wVerdict(),lw=wp.length?wp[wp.length-1].w:null;
 let h=`<div class="mut" style="margin:10px 2px 0">${fds(m0)} – ${fds(addD(m0,6))}</div><div class="kpis">
  <div class="kpi"><div class="l">Sessions</div><div class="v">${sess}<small> / 6</small></div><div class="d">this week</div></div>
  <div class="kpi"><div class="l">Sets</div><div class="v">${tot}<small> / ${plan}</small></div><div class="mini"><i style="width:${Math.min(100,tot/plan*100)}%"></i></div></div>
  <div class="kpi"><div class="l">Weight</div><div class="v">${lw==null?'–':lw.toFixed(1)}<small> kg</small></div><div class="d">${lw==null?'log it on Food':v?ic(v.d>.05?'up':'flat')+(v.d>=0?'+':'')+v.d.toFixed(2)+' / wk':'needs 2 weeks'}</div></div></div>`;
 h+=`<h2>Muscle coverage</h2><div class="mut" style="margin:0 2px 6px">Behind first, finished last. Tap a muscle for details.</div>
  <div class="key"><span><s></s>Sets logged</span><span><u></u>Planned before today</span></div><div class="card">`;
 h+=mus.map(m=>{const[c,i,l]=SS[m.s],open=sMu===m.n,left=m.t-m.d,gap=m.e-m.d;
  return`<button class="mr" data-a="smu" data-n="${m.n}" aria-expanded="${open}"><div class="hd"><span class="n">${m.n}</span><span class="f">${m.d} / ${m.t}</span><span class="tag ${c}">${ic(i)}${l}</span></div>
   <div class="trk"><i style="width:${Math.min(100,m.d/m.t*100)}%"></i>${m.e>0&&m.e<m.t?`<u style="left:calc(${m.e/m.t*100}% - 1px)"></u>`:''}</div>
   ${open?`<div class="more">${left>0?left+' sets left this week.':'Weekly target reached.'} ${gap>0?`You are ${gap} set${gap>1?'s':''} behind the plan so far.`:m.s=='later'?'Its first session comes later this week.':''}</div>`:''}</button>`}).join('')+'</div>';
 h+='<h2>Consistency</h2><div class="mut" style="margin:0 2px 6px">Sets logged each day, last 12 weeks.</div><div class="card"><div class="read" id="hread"><span>Tap a day to see its sets.</span></div><div class="heat">';
 const rl=['M','','W','','F','',''];
 for(let r=0;r<7;r++){h+=`<span class="rl">${rl[r]}</span>`;
  for(let c=0;c<12;c++){const x=addD(m0,(c-11)*7+r);let cls='cell',lab,on=false;
   if(x<D.start){cls+=' pre';lab='before you started'}else if(x>today){cls+=' fut';lab='not yet'}
   else{const n=dSets(x);cls+=heatL(n)+(sHt===x?' sel':'');lab=n+' sets';on=true}
   h+=`<button class="${cls}" ${on?`data-a="sht" data-d="${x}"`:'disabled'} aria-label="${fd(x)}: ${lab}"></button>`}}
 h+='</div><div class="leg">Fewer<i style="background:var(--ln)"></i><i style="background:color-mix(in srgb,var(--ac) 25%,var(--cd))"></i><i style="background:color-mix(in srgb,var(--ac) 50%,var(--cd))"></i><i style="background:color-mix(in srgb,var(--ac) 75%,var(--cd))"></i><i style="background:var(--ac)"></i>More sets</div></div>';
 if(sHt)h=h.replace('<span>Tap a day to see its sets.</span>',`<b>${dSets(sHt)} sets</b><span>${fd(sHt)}</span>`);
 return h}

function sBody(){
 const today=iso(new Date()),all=wpts(),lo=addD(today,-84),pts=all.filter(p=>p.d>=lo);
 let h='<h2>Weight trend</h2><div class="mut" style="margin:0 2px 6px">Dots are weigh-ins. The line is the 7-day average. The shaded band is your target gain.</div><div class="card">';
 if(!pts.length){WCH=null;return h+'<div class="empty">No weight logged yet. Enter it on the Food tab, 2–3 mornings a week.</div></div>'}
 const f0=pts[0].d;pts.forEach(p=>p.n=dn(f0,p.d));
 const lp=pts[pts.length-1],avgAt=p=>{const w=pts.filter(q=>q.n<=p.n&&q.n>p.n-7);return w.length>=2?w.reduce((s,q)=>s+q.w,0)/w.length:null};
 if(pts.length<2){WCH=null;return h+`<div class="read"><b>${lp.w.toFixed(1)} kg</b><span>${fd(lp.d)}</span></div><div class="empty">Log your weight on another day to draw the trend.</div></div>`}
 const W=340,H=200,L=36,R=12,Tp=14,B=26,xm=Math.max(dn(f0,today),7);
 const fw=pts.filter(p=>p.n<7),w0=fw.reduce((s,p)=>s+p.w,0)/fw.length,d0=fw.reduce((s,p)=>s+p.n,0)/fw.length;
 const lo_=n=>w0+.15*(n-d0)/7,hi_=n=>w0+.30*(n-d0)/7,ys=pts.map(p=>p.w).concat([lo_(xm),hi_(xm)]);
 const y0=Math.floor((Math.min(...ys)-.3)*2)/2,y1=Math.ceil((Math.max(...ys)+.3)*2)/2;
 const X=n=>L+n/xm*(W-L-R),Y=w=>Tp+(1-(w-y0)/(y1-y0))*(H-Tp-B),step=(y1-y0)>3?1:.5;
 let g='';
 for(let t=y0;t<=y1+1e-6;t+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--ln)"/><text class="sx" x="${L-6}" y="${Y(t)+4}" text-anchor="end">${t.toFixed(1)}</text>`;
 g+=[0,Math.round(xm/2),xm].map((n,i)=>`<text class="sx" x="${X(n)}" y="${H-8}" text-anchor="${i==0?'start':i==2?'end':'middle'}">${fds(addD(f0,n))}</text>`).join('');
 g+=`<polygon points="${X(d0)},${Y(hi_(d0))} ${X(xm)},${Y(hi_(xm))} ${X(xm)},${Y(lo_(xm))} ${X(d0)},${Y(lo_(d0))}" fill="var(--ac)" opacity=".12"/>`;
 g+=`<text class="sx" x="${X(xm)-4}" y="${Y(hi_(xm))-5}" text-anchor="end">Target 0.15–0.30 kg/wk</text>`;
 g+=pts.map(p=>`<circle cx="${X(p.n)}" cy="${Y(p.w)}" r="3" fill="var(--mu)" opacity=".55"/>`).join('');
 const av=pts.map(p=>({p,a:avgAt(p)})).filter(o=>o.a!=null);
 if(av.length>=2)g+=`<polyline points="${av.map(o=>X(o.p.n)+','+Y(o.a)).join(' ')}" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
 g+=`<line id="wg" x1="${X(lp.n)}" x2="${X(lp.n)}" y1="${Tp}" y2="${H-B}" stroke="var(--tx)" opacity=".35"/><circle id="wd" cx="${X(lp.n)}" cy="${Y(lp.w)}" r="5" fill="var(--cd)" stroke="var(--ac)" stroke-width="2.5"/>`;
 WCH={W,xs:pts.map(p=>X(p.n)),ys:pts.map(p=>Y(p.w)),t:pts.map(p=>{const a=avgAt(p);return{v:p.w.toFixed(1)+' kg',l:fd(p.d)+(a!=null?' · 7-day avg '+a.toFixed(1):'')}})};
 const v=wVerdict(),la=avgAt(lp);
 return h+`<div class="read"><b id="wv">${lp.w.toFixed(1)} kg</b><span id="wl">${fd(lp.d)}${la!=null?' · 7-day avg '+la.toFixed(1):''}</span></div>
  <svg class="ch" id="wch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Body weight over time with 7-day average and target band">${g}</svg>
  ${v?`<div class="verdict"><span class="tag ${v.c}">${ic(v.i)}${v.t}</span><span>${v.x}</span></div>`:'<div class="empty">Log your weight in 2 different weeks to see the weekly change.</div>'}
  <details><summary>Show as table</summary><table><tr><th>Date</th><th>Weight</th></tr>${pts.slice(-14).reverse().map(p=>`<tr><td>${fd(p.d)}</td><td>${p.w.toFixed(1)} kg</td></tr>`).join('')}</table></details></div>`}
function wsel(b){if(!WCH)return;$('#wg').setAttribute('x1',WCH.xs[b]);$('#wg').setAttribute('x2',WCH.xs[b]);$('#wd').setAttribute('cx',WCH.xs[b]);$('#wd').setAttribute('cy',WCH.ys[b]);$('#wv').textContent=WCH.t[b].v;$('#wl').textContent=WCH.t[b].l}
function wpick(e){const sv=WCH&&e.target.closest&&e.target.closest('#wch');if(!sv)return;const r=sv.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*WCH.W;let b=0;WCH.xs.forEach((x,i)=>{if(Math.abs(x-px)<Math.abs(WCH.xs[b]-px))b=i});wsel(b)}

const AN=[['Bench press',/^Barbell bench press/],['Bent-over row',/^Barbell bent-over row/],['Back squat',/^Barbell back squat/],['Shoulder press (dumbbell)',/^Seated dumbbell shoulder press/],['Lat pulldown',/^Lat pulldown \(neutral/],['Romanian deadlift',/^Barbell Romanian deadlift/]];
function anchor(re){const r=[];for(const x of Object.keys(D.logs).sort()){const w=D.logs[x].w||{};let top=null;
 for(const k in w){if(!re.test(k.split('|')[1]))continue;w[k].forEach(s=>{if(!s||!s[2])return;const kg=parseFloat(s[0]),rp=parseFloat(s[1]);if(!(kg>0&&rp>0))return;const e=kg*(1+rp/30);if(!top||e>top.e)top={d:x,kg,rp,e}})}
 if(top)r.push(top)}return r}
function spark(ss,on){const c=on?'var(--ac)':'var(--mu)';if(!ss.length)return'<svg class="sp" viewBox="0 0 100 30" aria-hidden="true"></svg>';
 if(ss.length<2)return`<svg class="sp" viewBox="0 0 100 30" aria-hidden="true"><circle cx="50" cy="15" r="3.5" fill="${c}"/></svg>`;
 const e=ss.map(s=>s.e),mn=Math.min(...e),r=(Math.max(...e)-mn)||1;
 return`<svg class="sp" viewBox="0 0 100 30" aria-hidden="true"><polyline points="${ss.map((s,i)=>(4+i/(ss.length-1)*92)+','+(26-(s.e-mn)/r*22)).join(' ')}" fill="none" stroke="${c}" stroke-width="${on?2.5:1.75}" stroke-linejoin="round" stroke-linecap="round" opacity="${on?1:.7}"/></svg>`}
function sLifts(){
 const A=AN.map(([n,re])=>({n,ss:anchor(re)}));if(sLift>=A.length)sLift=0;
 let h='<h2>Main lifts</h2><div class="mut" style="margin:0 2px 6px">Estimated one-rep max (1RM) of your anchor lifts, best set of each session. Tap one to open it.</div><div class="lgd">';
 h+=A.map((l,i)=>{const n=l.ss.length,cu=l.ss[n-1],dl=n>1?cu.e-l.ss[0].e:null;
  return`<button class="lc" data-a="sln" data-i="${i}" aria-pressed="${i==sLift}"><div class="n">${l.n}</div><div class="v">${n?Math.round(cu.e):'–'}<small>${n?' kg':''}</small></div>
   <div class="d">${n==0?'no sessions yet':dl==null?ic('flat')+'1 session':ic(dl>0.5?'up':'flat')+(dl>=0?'+':'')+Math.round(dl)+' kg since start'}</div>${spark(l.ss,i==sLift)}</button>`}).join('')+'</div>';
 const l=A[sLift],ss=l.ss,n=ss.length;
 h+=`<h2>${l.n}</h2><div class="card">`;
 if(!n)h+='<div class="empty">Log a completed set of this lift and it will show up here.</div>';
 else{const W=340,H=170,L=36,R=14,Tp=16,B=24,e=ss.map(s=>s.e),mn=Math.floor(Math.min(...e)-3),mx=Math.ceil(Math.max(...e)+3);
  const X=i=>L+(n>1?i/(n-1):.5)*(W-L-R),Y=v=>Tp+(1-(v-mn)/(mx-mn))*(H-Tp-B),stp=Math.max(1,Math.round((mx-mn)/3));
  let g='';for(let t=mn;t<=mx;t+=stp)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--ln)"/><text class="sx" x="${L-6}" y="${Y(t)+4}" text-anchor="end">${t}</text>`;
  let pr=0;e.forEach((v,i)=>{if(v>=e[pr])pr=i});
  if(n>1)g+=`<polyline points="${ss.map((s,i)=>X(i)+','+Y(s.e)).join(' ')}" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  g+=ss.map((s,i)=>`<circle cx="${X(i)}" cy="${Y(s.e)}" r="${i==pr?5.5:3.5}" fill="${i==pr?'var(--cd)':'var(--ac)'}" stroke="var(--ac)" stroke-width="${i==pr?2.5:0}"/>`).join('');
  g+=`<text class="sx" x="${X(pr)}" y="${Y(e[pr])-10}" text-anchor="${pr>n*.8&&n>2?'end':'middle'}" style="fill:var(--tx);font-weight:600">Best ${Math.round(e[pr])}</text>`;
  g+=`<text class="sx" x="${X(0)}" y="${H-6}" text-anchor="${n>1?'start':'middle'}">${fds(ss[0].d)}</text>`+(n>1?`<text class="sx" x="${X(n-1)}" y="${H-6}" text-anchor="end">${fds(ss[n-1].d)}</text>`:'');
  h+=`<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Estimated one-rep max per session for ${l.n}">${g}</svg>${n<2?'<div class="empty">Log one more session to draw a line.</div>':''}
   <table><tr><th>Date</th><th>Best set</th><th>Est. 1RM</th></tr>${ss.slice(-5).reverse().map(s=>`<tr><td>${fd(s.d)}</td><td>${s.kg} × ${s.rp}</td><td>${Math.round(s.e)} kg</td></tr>`).join('')}</table>
   <div class="mut" style="margin-top:8px">Epley formula. Less reliable above about 10 reps.</div>`}
 h+='</div>';
 const ps=prs();
 h+=`<details class="card"><summary><b>All exercises (${ps.length})</b></summary>${ps.length?`<table><tr><th>Exercise</th><th>Best set</th><th>Sessions</th></tr>${ps.map(o=>`<tr><td>${o.n}${o.cnt>1&&o.bd==o.ld?' 🏆':''}</td><td>${o.best.kg} × ${o.best.rp}</td><td>${o.cnt}</td></tr>`).join('')}</table>`:'<div class="empty">Log some sets and your lifts will appear here.</div>'}</details>`;
 return h}

function rS(){
 const an=stAn;stAn=false;
 const seg=[['w','This week'],['b','Body'],['l','Lifts']].map(([k,l])=>`<button role="tab" aria-selected="${sst==k}" data-a="sst" data-s="${k}">${l}</button>`).join('');
 return`<div class="st${an?' an':''}"><div class="seg" role="tablist" aria-label="Stats sections">${seg}</div><div role="tabpanel">${sst=='w'?sWeek():sst=='b'?sBody():sLifts()}</div></div>`}
// ---- Reps-left label, notes, weight suggestions ----
const lfT=v=>v===''||v==null?'left?':v>=3?'3+ left':v+' left';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const noteH=n=>D.notes&&D.notes[n]?`<div class="mut">📝 ${esc(D.notes[n])}</div>`:'';
// Double progression: add weight once every set hits the top of the rep range; 3+ reps left means the weight was too light.
function sugg(pv,r){
 if(!pv||!pv.length)return'';
 const hi=parseInt(String(r).split('–').pop()),lo=parseInt(String(r).split('–')[0]);
 const wts=pv.map(a=>parseFloat(a[0])).filter(x=>x>0);
 if(!wts.length||!hi)return'';
 const w=Math.max(...wts),at=pv.filter(a=>parseFloat(a[0])==w),mn=Math.min(...at.map(a=>parseFloat(a[1])||0)),lr=pv[pv.length-1][2],rir=lr===''||lr==null?null:+lr;
 let t;
 if(mn>=hi)t=rir!=null&&rir>=3?`Try ${w+5} kg (+5): it felt easy, ${rir}+ reps left`:`Try ${w+2.5} kg (+2.5): you hit ${hi} reps on every set`;
 else if(mn<lo)t=`Try ${w-2.5} kg (−2.5): reps fell below ${lo}`;
 else if(rir!=null&&rir>=3)t=`Try ${w+2.5} kg (+2.5): ${rir}+ reps were left`;
 else t=`Stay at ${w} kg: beat ${mn} reps on every set`;
 return`<div class="sg">${t}</div>`}
render();
</script></body></html>
