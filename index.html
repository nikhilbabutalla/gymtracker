<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2D4BD8">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Gym Tracker</title>
<style>
:root{--bg:#ECEEF1;--cd:#fff;--tx:#15181D;--mu:#6B7380;--ln:#D9DDE3;--ac:#2D4BD8;--ti:#DDE5FF}
@media(prefers-color-scheme:dark){:root{--bg:#101216;--cd:#1A1D23;--tx:#ECEEF1;--mu:#98A0AD;--ln:#2A2F38;--ac:#8FA6FF;--ti:#1E2748}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,Roboto,sans-serif;font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;background:var(--bg);border-bottom:1px solid var(--ln)}
header button{width:44px;height:44px;font-size:28px;background:none;border:0;color:var(--tx)}
h1{font-size:17px;margin:0}
h2{font-size:22px;margin:14px 2px 2px;letter-spacing:-.01em}
main{padding:0 12px 100px}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:10px;padding:12px;margin:10px 0}
.mut{color:var(--mu);font-size:13px}
.set{display:grid;grid-template-columns:20px 1fr 1fr 56px 44px;gap:8px;align-items:center;margin-top:8px}
.set span{color:var(--mu);font-size:13px}
input{width:100%;height:44px;font:inherit;font-size:18px;text-align:center;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx)}
.ck{width:44px;height:44px;border-radius:50%;border:2px solid var(--ln);background:none;color:var(--mu);font-size:20px;padding:0}
.ck.on{background:var(--ac);border-color:var(--ac);color:var(--bg)}
.row{display:flex;align-items:center;gap:10px;background:var(--cd);border:1px solid var(--ln);border-radius:10px;padding:8px 10px;margin:8px 0}
.row.on{background:var(--ti)}
.row>span{flex:1}
.q{display:flex;align-items:center;gap:6px;flex:none!important}
.q button{width:40px;height:40px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font-size:20px}
.q b{min-width:58px;text-align:center}
.btn{display:block;width:100%;height:48px;border:0;border-radius:10px;background:var(--ac);color:var(--bg);font:inherit;font-weight:600;margin-top:10px;text-align:center;line-height:48px}
.warn{background:var(--ti);border:1px solid var(--ac);border-radius:10px;padding:10px;margin:10px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;height:56px;border:0;background:none;color:var(--mu);font:inherit;font-weight:600}
nav button.on{color:var(--ac);box-shadow:inset 0 3px 0 var(--ac)}
summary{min-height:32px;cursor:pointer}
.it{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--ln)}
.it:first-of-type{margin-top:8px}
.it input{width:24px;height:24px;flex:none;accent-color:var(--ac)}
.lf{height:44px;border:1px solid var(--ln);border-radius:8px;background:none;color:var(--mu);font:inherit;font-size:12px;padding:0 2px}
.lf.on{color:var(--tx);border-color:var(--ac)}
.sg{color:var(--ac);font-weight:600;font-size:13px;margin-top:4px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.go{height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--ac);background:none;color:var(--ac);font:inherit;font-weight:600}
.card.act{border:2px solid var(--ac)}
#tp{position:fixed;left:8px;right:8px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:3;background:var(--ac);color:var(--bg);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 2px 12px #0006}
#tp[hidden]{display:none}
#tp>div{flex:1}
#tp button{height:40px;padding:0 12px;border:0;border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;font-weight:600}
.tm main{padding-bottom:200px}
.sr{display:flex;justify-content:space-between;margin-top:8px}
.bar{height:8px;border-radius:4px;background:var(--ln);margin-top:4px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--ac)}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
</style></head><body>
<header><button data-a="pv" aria-label="Previous day">‹</button><h1 id="dt"></h1><button data-a="nx" aria-label="Next day">›</button></header>
<main id="v"></main>
<div id="tp" hidden></div>
<nav><button data-a="tab" data-t="w">Workout</button><button data-a="tab" data-t="f">Food</button><button data-a="tab" data-t="s">Stats</button><button data-a="tab" data-t="b">Backup</button></nav>

["Legs + light shoulders","Barbell back squat|3|6–8;Leg press (feet high and wide)|2|10–15;Dumbbell walking lunge|3|8–10;Leg extension|3|12–15;Barbell Romanian deadlift|3|8–10;Leg curl|4|10–12;Single-leg dumbbell RDL|2|10–12;Leg press calf raise|5|10–15;Lean-away lateral raise|3|15–20;Cable rear-delt fly|2|15–20"]

["Back + biceps · volume","Lat pulldown (neutral or close grip)|3|10–12;Seated cable row (wide grip)|3|10–12;Dumbbell pullover|2|12–15;Cable shrug|2|12–15;Bayesian cable curl|3|12–15;Standing EZ-bar curl|2|10–12;Dumbbell preacher curl (slow)|2|12–15"],

[{2:[['Lean-away lateral raise',2,'12–20']],5:[['Lean-away lateral raise',2,'12–20'],['Cable rear-delt fly',2,'12–15']]},
 {2:[['Cable lateral raise (across the body)',2,'12–20']],5:[['Cable lateral raise (across the body)',2,'12–20'],['Bent-over dumbbell rear raise',2,'12–15']]}]

 const f=day().f||{};let k=0,p=0;
 let h='<h2>Food</h2><div class="mut" style="margin:0 2px">Tap ✓ if you ate it as usual. Use − and + if the amount changed.</div>'+F.map(x=>{const q=f[x[0]]||0;k+=q*x[5];p+=q*x[6];
  return`<div class="row${q?' on':''}"><button class="ck${q?' on':''}" data-a="ft" data-i="${x[0]}" aria-label="Ate ${x[1]}">✓</button><span>${x[1]}</span><span class="q"><button data-a="fm" data-i="${x[0]}" aria-label="Less">−</button><b>${q}${x[2]?' '+x[2]:''}</b><button data-a="fp" data-i="${x[0]}" aria-label="More">+</button></span></div>`}).join('');
 const lo=iso(new Date(dt(cur)-6048e5)),ds=Object.keys(D.logs).filter(x=>x<=cur&&x>lo&&D.logs[x].bw),av=ds.length?(ds.reduce((s,x)=>s+D.logs[x].bw,0)/ds.length).toFixed(1):'–';
 return h+`<div class="card"><b>${Math.round(k).toLocaleString()} kcal · ${Math.round(p)} g protein</b><div class="mut">Estimates from standard values, about ±10%.</div></div><div class="card"><label>Body weight today (kg)<input id="bw" type="number" inputmode="decimal" step="0.1" value="${day().bw??''}"></label><div class="mut" style="margin-top:6px">7-day average: ${av} kg</div></div>`}
function rB(){
 const n=Object.keys(D.logs).length;
 return`<h2>Backup</h2><div class="card"><p style="margin:0">${n} days logged. Last backup: ${D.bk?new Date(D.bk).toLocaleDateString():'never'}.</p><button class="btn" data-a="exp">Save backup file</button><p class="mut">Keep the file on Drive or send it to yourself. On a new phone, install the app and restore it here.</p><label class="btn" style="background:var(--ti);color:var(--tx)">Restore from backup file<input id="imp" type="file" accept=".json,application/json" hidden></label></div><div class="card"><label>Week 1 started on (a Monday)<input id="st" type="date" value="${D.start}"></label></div><div class="card"><b>Timer cues</b><div class="mut">Start some music, then tap to hear set start, set end, rest warning and finish over it.</div><button class="btn" data-a="tst">Play all cues</button></div>`}
function render(){
 $('#dt').textContent=(cur==iso(new Date())?'Today · ':'')+dt(cur).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
 $('#v').innerHTML=tab=='w'?rW():tab=='f'?rF():tab=='s'?rS():rB()}
function imp(f){if(!f)return;f.text().then(s=>{try{const n=JSON.parse(s);if(!n.logs)throw 0;if(confirm('Replace the data on this phone with this backup ('+Object.keys(n.logs).length+' days)?')){D=n;save();render()}}catch(e){alert('That file isn’t a Gym Tracker backup.')}})}
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.k!=null){const a=L().w[t.dataset.k]||(L().w[t.dataset.k]=[]),r=a[+t.dataset.j]||(a[+t.dataset.j]=['','',0]);r[+t.dataset.f]=t.value;save()}
 else if(t.dataset.g){const x=L().x||(L().x={}),a=x[t.dataset.g]||(x[t.dataset.g]=[]);a[+t.dataset.i]=t.checked?1:0;save()}
 else if(t.id=='bw'){L().bw=t.value?+t.value:undefined;save();render()}
 else if(t.id=='st'){D.start=t.value||D.start;save();render()}
 else if(t.id=='imp')imp(t.files[0])});
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
 if(a=='ck'){const i=t.parentElement.querySelectorAll('input'),kg=i[0].value||i[0].placeholder,rp=i[1].value||i[1].placeholder,ar=L().w[t.dataset.k]||(L().w[t.dataset.k]=[]),r=ar[+t.dataset.j]||(ar[+t.dataset.j]=['','',0]);
  if(r[2])r[2]=0;else{if(isNaN(parseFloat(kg))||isNaN(parseFloat(rp))){i[isNaN(parseFloat(kg))?0:1].focus();return}r[0]=kg;r[1]=rp;r[2]=1}
  i[0].value=r[0];i[1].value=r[1];t.classList.toggle('on',!!r[2]);save()}
 else if(a=='ft'||a=='fm'||a=='fp'){const f=F.find(x=>x[0]==t.dataset.i),m=L().f,q=m[f[0]]||0;m[f[0]]=a=='ft'?(q>0?0:f[3]):Math.max(0,+(q+(a=='fp'?f[4]:-f[4])).toFixed(2));save();render()}
 else if(a=='pv'||a=='nx'){const d=dt(cur);d.setDate(d.getDate()+(a=='nx'?1:-1));cur=iso(d);render()}
 else if(a=='tab'){tab=t.dataset.t;render();scrollTo(0,0)}
 else if(a=='lf'){const ar=L().w[t.dataset.k]||(L().w[t.dataset.k]=[]),r=ar[+t.dataset.j]||(ar[+t.dataset.j]=['','',0]),c=r[3];r[3]=(c===''||c==null)?0:c>=3?'':c+1;t.textContent=lfT(r[3]);t.classList.toggle('on',r[3]!==''&&r[3]!=null);save()}
 else if(a=='nt'){const n=t.dataset.n;D.notes=D.notes||{};const v=prompt('Note for '+n+' (leave empty to delete)',D.notes[n]||'');if(v!==null){if(v.trim())D.notes[n]=v.trim();else delete D.notes[n];save();render()}}
 else if(a=='go'){const ns=+t.dataset.s,g=(day().w||{})[t.dataset.k]||[];let si=0;while(si<ns&&g[si]&&g[si][2])si++;if(si>=ns)si=0;startT({k:t.dataset.k,n:t.dataset.n,ns,r:t.dataset.r,si})}
 else if(a=='skip'&&T){T.t0=Date.now()-T.du*1000;tick()}
 else if(a=='p15'&&T){T.du+=15;T.w=0;svT();draw()}
 else if(a=='stop')stopT();
 else if(a=='snd'){snd();draw()}
 else if(a=='tst'){snd();[['start',0],['end',1200],['warn',2400],['done',3800]].forEach(([c,d])=>setTimeout(()=>tone(CUE[c]),d))}
 else if(a=='bk'){tab='b';render()}
 else if(a=='exp'){D.bk=Date.now();save();const u=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:'application/json'})),x=document.createElement('a');x.href=u;x.download='gym-tracker-backup-'+iso(new Date())+'.json';x.click();setTimeout(()=>URL.revokeObjectURL(u),1e4);render()}});
addEventListener('hashchange',()=>{tab=location.hash=='#food'?'f':'w';render()});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
// ---- Set and rest timer (counts from saved timestamps; cues only fire while the app is open) ----
const TK=K+'t';let T=null,ac=null,wl=null,tm=null;
try{T=JSON.parse(localStorage.getItem(TK))}catch(e){}
const svT=()=>{try{T?localStorage.setItem(TK,JSON.stringify(T)):localStorage.removeItem(TK)}catch(e){}};
const CUE={start:[[880,0,.15],[1175,.2,.25]],end:[[660,0,.12],[660,.2,.12]],warn:[[440,0,.1],[440,.25,.1],[440,.5,.1]],done:[[880,0,.2],[660,.25,.2],[440,.5,.4]]};
function tone(p){if(ac){const t=ac.currentTime;p.forEach(([f,o,d])=>{const s=ac.createOscillator(),g=ac.createGain();s.frequency.value=f;s.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.0001,t+o);g.gain.exponentialRampToValueAtTime(.35,t+o+.02);g.gain.exponentialRampToValueAtTime(.0001,t+o+d);s.start(t+o);s.stop(t+o+d+.05)})}if(navigator.vibrate)navigator.vibrate(p.length>2?[80,60,80,60,80]:[120])}
const snd=()=>{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()};
const wake=async()=>{try{wl=await navigator.wakeLock.request('screen')}catch(e){}};
const unwake=()=>{try{wl&&wl.release()}catch(e){}wl=null};
const sd=r=>Math.max(15,Math.ceil((parseInt(String(r).split('–').pop())||10)*(D.tempo||4)));
const rf=(n,r)=>{const lo=parseInt(String(r).split('–')[0])||10;let x=lo<=8?150:lo<=10?120:lo<=12?90:60;if(/press|squat|deadlift|row|pulldown|lunge|step-up/i.test(n))x=Math.max(x,120);if(/crunch|leg raise|sit-up|rollout/i.test(n))x=75;return x};
function adv(late){const p=T.du;
 if(T.ph=='ready'){T.ph='set';T.du=sd(T.r);if(!late)tone(CUE.start)}
 else if(T.ph=='set'){if(T.si+1>=T.ns){if(!late)tone(CUE.done);stopT();return}T.ph='rest';T.du=rf(T.n,T.r);T.w=0;if(!late)tone(CUE.end)}
 else{T.si++;T.ph='set';T.du=sd(T.r);if(!late)tone(CUE.start)}
 T.t0+=p*1000}
function stopT(){T=null;svT();unwake();clearInterval(tm);tm=null;draw();if(tab=='w')render()}
function tick(){if(!T)return;const n=Date.now();
 while(T&&(n-T.t0)/1000>=T.du)adv((n-T.t0)/1000-T.du>3);
 if(!T)return;
 if(T.ph=='rest'&&!T.w&&T.du>20&&T.du-(n-T.t0)/1000<=10){T.w=1;tone(CUE.warn)}
 svT();draw()}
function draw(){const p=$('#tp');
 if(!T){p.hidden=true;document.body.classList.remove('tm');return}
 const r=Math.max(0,T.du-(Date.now()-T.t0)/1000),lb={ready:'GET READY',set:'SET',rest:'REST'}[T.ph];
 p.hidden=false;document.body.classList.add('tm');
 p.innerHTML=`<div><div style="font-size:12px">${T.n} · set ${T.si+1}/${T.ns}</div><b style="font-size:26px">${lb} ${Math.floor(r/60)}:${String(Math.floor(r%60)).padStart(2,'0')}</b></div>`+(ac?'':'<button data-a="snd">Sound on</button>')+(T.ph=='rest'?'<button data-a="p15">+15 s</button>':'')+'<button data-a="skip">Skip</button><button data-a="stop">Stop</button>'}
function startT(o){snd();T=Object.assign(o,{ph:'ready',t0:Date.now(),du:5,w:0});svT();wake();clearInterval(tm);tm=setInterval(tick,250);tick();render()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&T){wake();tick()}});
if(T){tm=setInterval(tick,250);tick()}
// ---- Stats: weekly sets per muscle, weight trend, progress ----
const TG={Chest:20,Back:18,Traps:5,Shoulders:23,Triceps:14,Biceps:14,Forearms:9,Abs:10,Quads:13,Hamstrings:12,Glutes:4,Calves:10};
const grp=(n,d)=>/crunch|leg raise|sit-up|rollout/i.test(n)?'Abs':/calf/i.test(n)?'Calves':/hip thrust/i.test(n)?'Glutes':/shrug/i.test(n)?'Traps':/shoulder press|lateral raise|rear|face pull|reverse pec deck/i.test(n)?'Shoulders':/back extension/i.test(n)?(d=='2'?'Back':'Hamstrings'):/leg curl|romanian|RDL/i.test(n)?'Hamstrings':/squat|leg press|lunge|step-up|leg extension/i.test(n)?'Quads':/extension|pushdown|skull|dip machine/i.test(n)?'Triceps':/wrist|reverse curl/i.test(n)?'Forearms':/curl/i.test(n)?'Biceps':/row|pulldown|pullover|shrug/i.test(n)?'Back':/press|fly|pec deck/i.test(n)?'Chest':null;
function wsets(){const m=mon(cur),c={};for(let i=0;i<7;i++){const d=new Date(m);d.setDate(d.getDate()+i);const w=(D.logs[iso(d)]||{}).w||{};for(const k in w){const g=grp(k.split('|')[1],k[1]);if(g)c[g]=(c[g]||0)+w[k].filter(s=>s&&s[2]).length}}return c}
function wt(){const r={};for(const x in D.logs){const b=+D.logs[x].bw;if(b>0){const k=iso(mon(x));(r[k]=r[k]||[]).push(b)}}return Object.keys(r).sort().slice(-6).map(k=>({k,a:r[k].reduce((s,v)=>s+v,0)/r[k].length}))}
function prs(){const m={};for(const x of Object.keys(D.logs).sort()){const w=D.logs[x].w||{};for(const k in w){const n=k.split('|')[1];let top=null;w[k].forEach(s=>{if(!s||!s[2])return;const kg=parseFloat(s[0]),rp=parseFloat(s[1]);if(!(kg>0&&rp>0))return;const e=kg*(1+rp/30);if(!top||e>top.e)top={kg,rp,e}});if(!top)continue;const o=m[n];if(!o)m[n]={n,best:top,bd:x,last:top,ld:x,cnt:1};else{o.cnt++;if(top.e>o.best.e){o.best=top;o.bd=x}o.last=top;o.ld=x}}}return Object.values(m).sort((a,b)=>b.ld.localeCompare(a.ld))}
function rS(){
 const c=wsets();
 let h='<h2>This week</h2><div class="mut" style="margin:0 2px">Logged sets so far, against the weekly plan.</div><div class="card">'+Object.keys(TG).map(g=>{const n=c[g]||0;return`<div class="sr"><span>${g}</span><span>${n} / ${TG[g]}</span></div><div class="bar"><i style="width:${Math.min(100,n/TG[g]*100)}%"></i></div>`}).join('')+'</div>';
 const ws=wt();
 h+='<h2>Weight trend</h2><div class="card">';
 if(!ws.length)h+='<div class="mut">Log your weight on the Food tab 2–3 mornings a week.</div>';
 else{h+=ws.map((x,i)=>{const dl=i?x.a-ws[i-1].a:null;return`<div class="sr"><span>Week of ${x.k.slice(5)}</span><span>${x.a.toFixed(1)} kg${dl==null?'':` (${dl>=0?'+':''}${dl.toFixed(2)})`}</span></div>`}).join('');
  if(ws.length>1){const d=ws[ws.length-1].a-ws[ws.length-2].a;h+=`<div class="mut" style="margin-top:8px">Target gain: 0.15–0.30 kg a week. ${d>.4?'Faster than planned. If this lasts 3 weeks, trim about 200 kcal.':d<.1?'Slower than planned. If this lasts 3 weeks, add about 200 kcal.':'On track.'}</div>`}}
 h+='</div><h2>Progress</h2><div class="mut" style="margin:0 2px">Best set is ranked by estimated 1RM. 🏆 means your best came last session.</div>';
 const ps=prs();
 return h+(ps.length?ps.slice(0,40).map(o=>`<div class="card"><b>${o.n}</b>${o.cnt>1&&o.bd==o.ld?' 🏆':''}<div class="mut">Last ${o.last.kg}×${o.last.rp} · Best ${o.best.kg}×${o.best.rp} (est. 1RM ${Math.round(o.best.e)} kg) · ${o.cnt} sessions</div></div>`).join(''):'<div class="card mut">Log some sets and your best lifts will appear here.</div>')}
// ---- Reps-left label, notes, weight suggestions ----
const lfT=v=>v===''||v==null?'left?':v>=3?'3+ left':v+' left';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const noteH=n=>D.notes&&D.notes[n]?`<div class="mut">📝 ${esc(D.notes[n])}</div>`:'';
// Double progression: add weight once every set hits the top of the rep range; 3+ reps left means the weight was too light.
function sugg(pv,r){
 if(!pv||!pv.length)return'';
 const hi=parseInt(String(r).split('–').pop()),lo=parseInt(String(r).split('–')[0]);
 const wts=pv.map(a=>parseFloat(a[0])).filter(x=>x>0);
 if(!wts.length||!hi)return'';
 const w=Math.max(...wts),at=pv.filter(a=>parseFloat(a[0])==w),mn=Math.min(...at.map(a=>parseFloat(a[1])||0)),lr=pv[pv.length-1][2],rir=lr===''||lr==null?null:+lr;
 let t;
 if(mn>=hi)t=rir!=null&&rir>=3?`Try ${w+5} kg (+5): it felt easy, ${rir}+ reps left`:`Try ${w+2.5} kg (+2.5): you hit ${hi} reps on every set`;
 else if(mn<lo)t=`Try ${w-2.5} kg (−2.5): reps fell below ${lo}`;
 else if(rir!=null&&rir>=3)t=`Try ${w+2.5} kg (+2.5): ${rir}+ reps were left`;
 else t=`Stay at ${w} kg: beat ${mn} reps on every set`;
 return`<div class="sg">${t}</div>`}
render();
</script></body></html>
